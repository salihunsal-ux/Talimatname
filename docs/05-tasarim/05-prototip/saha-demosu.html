<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talimatname Saha Demosu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&display=swap">
<style>
:root{
  --zemin:#f7f5ef; --yuzey:#fff; --yuzey2:#efece4; --ink:#1c2128; --ink2:#4b5560; --sessiz:#7b8590; --cizgi:#d6d9d2;
  --marka:#1f6f5b; --markaA:#dcebe5; --kritik:#b8452f; --kritikA:#f3ddd8; --uyari:#b7791f; --uyariA:#f6ebd2; --pasif:#c9ced6;
  --serif:Bitter,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--zemin);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;line-height:1.2}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 48px}
.bar{position:sticky;top:0;z-index:30;background:var(--yuzey);border-bottom:1px solid var(--cizgi)}
.bar-in{max-width:1180px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wm{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:-.01em}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--yuzey2);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--markaA);color:var(--marka)} .pill.warn{background:var(--uyariA);color:var(--uyari)}
.pill.crit{background:var(--kritikA);color:var(--kritik)} .pill.gri{background:var(--yuzey2);color:var(--sessiz)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;border:1.5px solid var(--cizgi);background:var(--yuzey);font-size:14px;font-weight:600}
.btn.pri{background:var(--marka);border-color:var(--marka);color:#fff}
.btn.dar{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.kritik{background:var(--kritik);border-color:var(--kritik);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.kucuk{padding:6px 10px;font-size:13px;border-radius:9px;font-weight:500}
.kart{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:14px;padding:14px 16px}
.uyari-bant{background:var(--uyariA);border-left:3px solid var(--uyari);border-radius:0 10px 10px 0;padding:9px 12px;font-size:12.5px;line-height:1.45;color:var(--ink2);margin:10px 0}
.etiket{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sessiz)}
.mut{color:var(--ink2)} .ss{font-size:13px;color:var(--sessiz)}
.grid{display:grid;gap:12px}
.satir{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--cizgi);min-height:58px}
.satir:last-child{border-bottom:0}
.kutucuk{width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);background:var(--yuzey)}
.kutucuk.ok{background:var(--marka);border-color:var(--marka)} .kutucuk.crit{background:var(--kritikA);border-color:var(--kritik)}
.kutucuk.un{background:var(--uyariA);border-color:var(--uyari);color:var(--uyari);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(28,33,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--yuzey);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 18px 26px;display:flex;flex-direction:column;gap:11px}
@media(min-width:640px){.sheet{align-items:center}.sheet-in{border-radius:18px;max-height:88vh}}
.sec{border:1.5px solid var(--cizgi);border-radius:12px;padding:11px 13px;background:var(--yuzey);display:flex;align-items:center;gap:10px}
.sec.on{border-color:var(--marka);background:var(--markaA)}
.giris{width:100%;border:1.5px solid var(--cizgi);border-radius:10px;padding:10px 12px;background:var(--yuzey)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;padding:8px 10px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sessiz);background:var(--yuzey2);border-bottom:1px solid var(--cizgi)}
td{padding:8px 10px;border-bottom:1px solid var(--cizgi);vertical-align:top}
tr:last-child td{border-bottom:0}
.tablo{border:1px solid var(--cizgi);border-radius:11px;overflow:hidden;background:var(--yuzey)}
.izgara{display:grid;gap:4px 6px;align-items:center;font-size:12px}
.hucre{height:24px;border-radius:5px;cursor:pointer}
.kpi{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:12px;padding:10px 12px}
.kpi b{font-family:var(--serif);font-size:24px;display:block;line-height:1.1}
.foto{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--cizgi);background:var(--yuzey2)}
.damga{font:10px/1.3 var(--mono);color:#fff;background:rgba(28,33,40,.84);padding:3px 5px;border-radius:0 0 7px 7px;margin-top:-5px}
.olay{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:4px 0;border-bottom:1px dotted var(--cizgi);font-size:12.5px}
.olay b{font:11.5px var(--mono);color:var(--ink2)}
#rapor{position:fixed;inset:0;z-index:60;background:var(--yuzey);overflow:auto;-webkit-overflow-scrolling:touch}
#rapor .rust{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--yuzey2);border-bottom:1px solid var(--cizgi)}
#rapor .ric{max-width:820px;margin:0 auto;padding:22px 20px 60px;font-size:13px;line-height:1.5}
#rapor h1{font-size:21px;margin:0 0 2px} #rapor h3{font-size:16px;margin:18px 0 8px}
#rapor .rss{color:var(--sessiz);font-size:12px}
#rapor table{border-collapse:collapse;width:100%;margin-top:14px;font-size:12.5px}
#rapor th{background:var(--yuzey2);text-align:left;padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--sessiz)}
#rapor td{padding:6px 8px;border-bottom:1px solid var(--cizgi);vertical-align:top}
#rapor td.rk{color:var(--kritik);font-weight:700}
#rapor .rn{color:var(--sessiz);font-size:11px}
#rapor .rfoto{display:flex;flex-wrap:wrap;gap:10px}
#rapor .rf{width:160px} #rapor .rf img{width:160px;height:120px;object-fit:cover;border:1px solid var(--cizgi);border-radius:6px;display:block}
#rapor .rd{font:10px var(--mono);color:#fff;background:rgba(28,33,40,.84);padding:2px 4px;border-radius:0 0 5px 5px}
#rapor .rkod{margin-top:20px;border-top:1px solid var(--cizgi);padding-top:8px;font:11px var(--mono);color:var(--sessiz)}
@media screen and (max-width:560px){
  #rapor .ric{padding:14px 12px 50px;font-size:12.5px}
  #rapor table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  #rapor .rf{width:46%} #rapor .rf img{width:100%}
}
@media (max-width:560px){
  .bar-in{padding:7px 12px;gap:6px}
  .wm{font-size:16px}
  .bar .pill{font-size:11px;padding:2px 8px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .btn.kucuk{padding:5px 9px;font-size:12.5px}
  .wrap{padding:0 11px 40px}
}
@media print{
  .bar,.yazdirma-gizle{display:none!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  body.rapor-acik > *:not(#rapor){display:none!important}
  body.rapor-acik #rapor{position:static;overflow:visible}
  body.rapor-acik #rapor .ric{max-width:none;padding:0}
  @page{size:A4;margin:14mm}
}
</style>

<div class="bar yazdirma-gizle"><div class="bar-in">
  <div class="wm"><svg viewBox="0 0 64 64" width="21" height="21"><path d="M14 4 H38 L48 14 V56 A4 4 0 0 1 44 60 H14 A4 4 0 0 1 10 56 V8 A4 4 0 0 1 14 4 Z" fill="#1c2128"/><path d="M38 4 V14 H48 Z" fill="#f7f5ef"/><rect x="17" y="22" width="20" height="4" rx="2" fill="#f7f5ef"/><rect x="17" y="31" width="14" height="4" rx="2" fill="#f7f5ef"/><circle cx="46" cy="46" r="14" fill="#1f6f5b" stroke="#f7f5ef" stroke-width="3"/><path d="M39 46.5 L44 51.5 L53.5 41" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg> talimatname</div>
  <span class="pill gri" id="modRozet">yükleniyor…</span>

  <div style="margin-left:auto;display:flex;gap:7px;flex-wrap:wrap">
    <button class="btn kucuk" data-git="kiosk" data-uzun="Şube tableti" data-kisa="Tablet">Şube tableti</button>
    <button class="btn kucuk" data-git="ozet" data-uzun="Sabah özeti" data-kisa="Özet">Sabah özeti</button>
    <button class="btn kucuk" data-git="merkez" data-uzun="Merkez panosu" data-kisa="Pano">Merkez panosu</button>
    <button class="btn kucuk" data-git="ayar" data-uzun="Demo ayarı" data-kisa="Ayar">Demo ayarı</button>
  </div>
</div></div>

<script>
/* ---------------------------------------------------------------- sabitler */
const SUBELER = [
  {id:"kadikoy", ad:"Kadıköy", kapanis:"23:00", acilis:"08:00"},
  {id:"uskudar", ad:"Üsküdar", kapanis:"23:00", acilis:"07:30"},
  {id:"bakirkoy", ad:"Bakırköy", kapanis:"22:00", acilis:"09:00"},
];
const PERSONEL = [
  {id:"emre", ad:"Emre T.", pin:"1234", sube:"kadikoy"},
  {id:"deniz", ad:"Deniz K.", pin:"2345", sube:"kadikoy"},
  {id:"burak", ad:"Burak S.", pin:"3456", sube:"uskudar"},
  {id:"elif", ad:"Elif Y.", pin:"4567", sube:"bakirkoy"},
];
const SORUMLU = "Ayşe K. (şube müdürü)";
// pencere: kapanış listesi kapanıştan 60 dk önce açılır, 90 dk sonra kapanır, tolerans 120 dk;
// açılış listesi açılıştan 45 dk önce açılır, 30 dk sonra kapanır, tolerans 60 dk
const LISTELER = {
  kapanis: {ad:"Kapanış listesi", capa:"kapanis", oncesi:60, sonrasi:90, tolerans:120},
  acilis:  {ad:"Açılış listesi",  capa:"acilis",  oncesi:45, sonrasi:30, tolerans:60},
};
const MADDELER = {
 kapanis: [
  {no:1, bolum:"A · Bar ve mutfak", ad:"Espresso makinesi geri yıkandı; süt hortumları temizlendi", tur:"onay", z:true},
  {no:2, bolum:"A · Bar ve mutfak", ad:"Kahve makinesi ve öğütücü temizlendi", tur:"onay", z:true, f:true},
  {no:3, bolum:"A · Bar ve mutfak", ad:"Süt dolabı sıcaklığı", tur:"sicaklik", z:true, k:true, alt:0, ust:4, bas:3.1},
  {no:4, bolum:"A · Bar ve mutfak", ad:"Mutfak buzdolabı sıcaklığı", tur:"sicaklik", z:true, k:true, alt:0, ust:4, bas:3.4},
  {no:5, bolum:"A · Bar ve mutfak", ad:"Dondurucu sıcaklığı", tur:"sicaklik", z:true, k:true, alt:-30, ust:-18, bas:-19.5},
  {no:6, bolum:"A · Bar ve mutfak", ad:"Açık ürünler etiketlendi ve dolaba kaldırıldı", tur:"onay", z:true},
  {no:7, bolum:"A · Bar ve mutfak", ad:"Fritöz kapatıldı, yağ süzüldü, kapağı kapatıldı", tur:"secim", z:true, secenekler:["Yapıldı","Uygun değil","Yapılamadı"]},
  {no:8, bolum:"B · Salon ve tuvalet", ad:"Masalar, sandalyeler ve servis istasyonu silindi", tur:"onay", z:true},
  {no:9, bolum:"B · Salon ve tuvalet", ad:"Zemin süpürüldü ve paspaslandı", tur:"onay", z:true, f:true},
  {no:10, bolum:"B · Salon ve tuvalet", ad:"Tuvaletler kontrol edildi, sarf malzemesi tamam", tur:"onay", z:true},
  {no:11, bolum:"C · Kapanış ve güvenlik", ad:"Çöp alanı boşaltıldı", tur:"onay", z:true, f:true},
  {no:12, bolum:"C · Kapanış ve güvenlik", ad:"Gaz vanası kapatıldı", tur:"onay", z:true, k:true},
  {no:13, bolum:"C · Kapanış ve güvenlik", ad:"Kasa sayımı yapıldı, fark (₺)", tur:"sayi", z:true, k:true, bas:0},
  {no:14, bolum:"C · Kapanış ve güvenlik", ad:"Kepenk indirildi ve alarm kuruldu", tur:"onay", z:true, f:true},
  {no:15, bolum:"C · Kapanış ve güvenlik", ad:"Devreden kişiye not", tur:"metin"},
 ],
 acilis: [
  {no:1, bolum:"A · Soğuk zincir", ad:"Buzdolabı sıcaklığı", tur:"sicaklik", z:true, k:true, alt:0, ust:4, bas:3.2},
  {no:2, bolum:"A · Soğuk zincir", ad:"Dondurucu sıcaklığı", tur:"sicaklik", z:true, k:true, alt:-30, ust:-18, bas:-20.0},
  {no:3, bolum:"A · Soğuk zincir", ad:"Teşhir ürünlerinin tarihleri kontrol edildi", tur:"onay", z:true, k:true},
  {no:4, bolum:"B · Hazırlık", ad:"Kahve makinesi ısındı, test shot alındı", tur:"onay", z:true},
  {no:5, bolum:"B · Hazırlık", ad:"Vitrin ve salon düzeni hazır", tur:"onay", z:true, f:true},
  {no:6, bolum:"B · Hazırlık", ad:"Tuvaletler kontrol edildi, sarf malzemesi tamam", tur:"onay", z:true},
  {no:7, bolum:"C · Açılış", ad:"Kasa açılış bakiyesi sayıldı (₺)", tur:"sayi", z:true, k:true, bas:500},
  {no:8, bolum:"C · Açılış", ad:"Kapı açılış saatinde açıldı", tur:"secim", z:true, secenekler:["Zamanında","Geç açıldı","Yapılamadı"]},
  {no:9, bolum:"C · Açılış", ad:"Dün geceden devralınan not", tur:"metin"},
 ],
};

/* ---------------------------------------------------------------- yardımcı */
const $ = (s,k=document)=>k.querySelector(s);
const SVG_NS = "http://www.w3.org/2000/svg";
const SVG_ETIKET = new Set(["svg","path","circle","rect","line","polyline","polygon","g","text"]);
const el = (t,a={},...c)=>{const n = SVG_ETIKET.has(t) ? document.createElementNS(SVG_NS,t) : document.createElement(t);
  for(const [k,v] of Object.entries(a)){
    if(k==="html"){ if(n.namespaceURI===SVG_NS){ const tmp=document.createElementNS(SVG_NS,"svg"); tmp.innerHTML=v; while(tmp.firstChild) n.appendChild(tmp.firstChild); } else n.innerHTML=v; }
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),v); else if(v!==null&&v!==false&&v!==undefined) n.setAttribute(k,v);}
  c.flat().forEach(x=>{ if(x==null||x===false) return; n.append(x.nodeType?x:document.createTextNode(String(x)));});
  return n;};
const iki = n => String(n).padStart(2,"0");
const saatStr = d => iki(d.getHours())+":"+iki(d.getMinutes());
const gunStr = d => d.getFullYear()+"-"+iki(d.getMonth()+1)+"-"+iki(d.getDate());
const AYLAR = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const tarihStr = d => d.getDate()+" "+AYLAR[d.getMonth()];
const uuid = () => "x"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function kod(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;const a="0123456789ABCDEFGHJKLMNPRSTUVYZ";let o="";for(let i=0;i<9;i++){o+=a[h%31];h=Math.floor(h/31)+ (i*7+13);}return "TN-"+o.slice(0,5)+"-"+o.slice(5);}

/* ---------------------------------------------------------------- durum */
const S = {
  mod:"yerel", db:null, yazabilir:false,
  rol:(location.hash.replace("#","")||"kiosk"),
  sube:localStorage.getItem("td.sube")||"kadikoy",
  kisi:null, kaydirma:0, kosmalar:{}, kanitlar:{}, acik:null, uyandir:null,
};
function simdi(){ return new Date(Date.now() + S.kaydirma*60000); }

function maddeler(liste){ return MADDELER[liste] || MADDELER.kapanis; }
function listeAdi(liste){ return (LISTELER[liste]||LISTELER.kapanis).ad; }

/* pencere hesabı: liste tipine göre şubenin kapanış ya da açılış saatinden türetilir */
function pencere(subeId, gun, liste="kapanis"){
  const sube = SUBELER.find(x=>x.id===subeId), L = LISTELER[liste]||LISTELER.kapanis;
  const [sa,dk] = (sube[L.capa]||sube.kapanis).split(":").map(Number);
  const [y,m,d] = gun.split("-").map(Number);
  const capa = new Date(y, m-1, d, sa, dk);
  const bas = new Date(capa.getTime() - L.oncesi*60000);
  const bit = new Date(capa.getTime() + L.sonrasi*60000);
  const tol = new Date(bit.getTime() + L.tolerans*60000);
  return {bas, bit, tol};
}
function isGunu(subeId, t){            // gece 00:00–06:00 arası önceki iş gününe yazılır
  const d = new Date(t.getTime());
  if (d.getHours() < 6) d.setDate(d.getDate()-1);
  return gunStr(d);
}
function oncekiGun(gun){ const [y,m,d]=gun.split("-").map(Number); const t=new Date(y,m-1,d); t.setDate(t.getDate()-1); return gunStr(t); }
function kosmaId(subeId, gun, liste="kapanis"){ return subeId+"_"+gun+"_"+liste; }
/* sabah özetinin kapsadığı iş günü: akşam 18:00'den önce bakılıyorsa dün gece */
function ozetGunu(t){ const d=new Date(t.getTime()); if (d.getHours() < 18) d.setDate(d.getDate()-1); return gunStr(d); }

function durumHesapla(k, t, subeId, gun, liste){
  const sid = k ? k.sube : subeId, g = k ? k.gun : gun, li = (k && k.liste) ? k.liste : (liste||"kapanis");
  if (!sid || !g) return "planlandi";
  if (k && k.durum==="gonderildi") return k.sonuc;   // basarili | basarisiz
  const p = pencere(sid, g, li);
  if (t > p.tol) return "kacirildi";                  // gönderim yok, tolerans doldu
  if (t >= p.bas) return "acik";
  return "planlandi";
}
const DURUM_RENK = {basarili:"var(--marka)", basarisiz:"var(--kritik)", kacirildi:"var(--kritik)", acik:"var(--uyari)", planlandi:"var(--pasif)", gec:"var(--uyari)"};
const DURUM_AD = {basarili:"tamamlandı", basarisiz:"başarısız", kacirildi:"kaçırıldı", acik:"açık", planlandi:"planlandı", gec:"geç"};

/* ---------------------------------------------------------------- depo (paylaşımlı veya yerel) */
const YerelDepo = {
  oku(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } },
  yaz(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const Depo = {
  async kosmaYaz(k){
    S.kosmalar[k.id] = k;
    if (S.mod==="paylasimli"){ try{ await S.db.doc("kosmalar/"+k.id).set(k); return true; }catch(e){ console.warn(e); S.mod="yerel"; modRozet(); } }
    const hepsi = YerelDepo.oku("td.kosmalar")||{}; hepsi[k.id]=k; YerelDepo.yaz("td.kosmalar",hepsi);
    ciz(); return true;
  },
  async kanitYaz(id, veri){
    S.kanitlar[id] = veri;
    if (S.mod==="paylasimli"){ try{ await S.db.doc("kanitlar/"+id).set(veri); return true; }catch(e){ console.warn(e); } }
    const hepsi = YerelDepo.oku("td.kanitlar")||{}; hepsi[id]=veri; YerelDepo.yaz("td.kanitlar",hepsi);
    return true;
  },
  async kanitOku(id){
    if (S.kanitlar[id]) return S.kanitlar[id];
    if (S.mod==="paylasimli"){ try{ const s = await S.db.doc("kanitlar/"+id).get(); if (s.exists){ S.kanitlar[id]=s.data(); return s.data(); } }catch(e){} }
    const hepsi = YerelDepo.oku("td.kanitlar")||{}; return hepsi[id]||null;
  },
  async ozetOku(h){
    if (S.mod==="paylasimli"){ try{ const d = await S.db.doc("ozetler/"+h).get(); if (d.exists) return d.data(); return null; }catch(e){} }
    const hepsi = YerelDepo.oku("td.ozetler")||{}; return hepsi[h]||null;
  },
  async ozetYaz(h, meta){
    if (S.mod==="paylasimli"){ try{ await S.db.doc("ozetler/"+h).set(meta); return; }catch(e){} }
    const hepsi = YerelDepo.oku("td.ozetler")||{}; hepsi[h]=meta; YerelDepo.yaz("td.ozetler",hepsi);
  },
  async ayarYaz(a){
    if (S.mod==="paylasimli"){ try{ await S.db.doc("demo/ayar").set(a); return; }catch(e){} }
    YerelDepo.yaz("td.ayar", a);
  },
  async hepsiniSil(){
    if (S.mod==="paylasimli"){

/* ---------------------------------------------------------------- koşma (çalıştırma) işlemleri */
function kosmaBul(subeId, gun, liste="kapanis"){ return S.kosmalar[kosmaId(subeId,gun,liste)]||null; }
function yeniKosma(subeId, gun, kisi, liste="kapanis"){
  return {id:kosmaId(subeId,gun,liste), sube:subeId, gun, liste, durum:"acik", sonuc:null,
          kisi:kisi?kisi.ad:null, acilis:simdi().toISOString(), gonderim:null, cevaplar:{}, aksiyonlar:[], olaylar:[]};
}
function olay(k, ne, kim){ k.olaylar = (k.olaylar||[]).concat([{t:simdi().toISOString(), kim:kim||(S.kisi?S.kisi.ad:"sistem"), ne}]).slice(-60); }
function cevapDurum(m, c){
  if (!c) return "bos";
  if (c.yapilamadi) return "yapilamadi";
  if (m.tur==="sicaklik" || m.tur==="sayi"){
    if (c.deger===undefined||c.deger===null||c.deger==="") return "bos";
    if (m.alt!==undefined && (c.deger < m.alt || c.deger > m.ust)) return "basarisiz";
    return "ok";
  }
  if (m.tur==="onay") return c.deger===true ? "ok" : c.deger===false ? "basarisiz" : "bos";
  if (m.tur==="secim") return c.deger ? (c.deger==="Yapıldı"?"ok":c.deger==="Uygun değil"?"ok":"basarisiz") : "bos";
  if (m.tur==="metin") return c.deger ? "ok" : "bos";
  return "bos";
}
function eksikler(k){
  return maddeler(k.liste).filter(m=>{
    const c = k.cevaplar[m.no]; const d = cevapDurum(m,c);
    if (!m.z) return false;
    if (d==="bos") return true;
    if ((d==="basarisiz") && (!c.not || !c.kanit)) return true;      // sabit kural: not + fotoğraf
    if (d==="yapilamadi" && !c.sebep) return true;
    if (m.f && d==="ok" && !c.kanit) return true;
    return false;
  });
}

/* ---------------------------------------------------------------- kanıt bütünlüğü (E-11) */
async function dosyaOzeti(dosya){                 // SHA-256, tarayıcıda
  try{
    const buf = await dosya.arrayBuffer();
    const h = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return null; }                       // güvenli bağlam yoksa tekillik kontrolü yapılamaz
}
function dosyaBayraklari(dosya){
  const b = [];
  const yas = Date.now() - (dosya.lastModified || Date.now());
  if (yas > 15*60000){
    const dk = Math.round(yas/60000);
    b.push({tip:"eski-dosya", metin:"Fotoğraf şimdi çekilmemiş — dosya " + (dk>90 ? Math.round(dk/60)+" saat" : dk+" dakika") + " önceye ait"});
  }
  return b;
}
function bayrakRozet(b){
  return el("span",{class:"pill warn",style:"font-size:10.5px",title:b.metin}, b.tip==="eski-dosya" ? "eski dosya" : b.tip);
}
function kosmaBayraklari(k){                       // çalıştırmadaki tüm kanıt bayrakları
  const out = [];
  Object.entries(k.cevaplar||{}).forEach(([no,c])=>{ (c.bayraklar||[]).forEach(b=> out.push({madde:+no, ...b})); });
  (k.olaylar||[]).forEach(o=>{ if (/ikinci kez/.test(o.ne)) out.push({madde:null, tip:"kopya-reddi", metin:o.ne}); });
  return out;
}

/* ---------------------------------------------------------------- sıcaklık / ölçüm günlüğü (R-4) */
function olcumSatirlari(gunSayisi=30, subeId=null){
  const t = simdi(), sinir = new Date(t.getTime() - gunSayisi*86400000);
  const satirlar = [];
  Object.values(S.kosmalar).forEach(k=>{
    if (subeId && k.sube!==subeId) return;
    const g = new Date(k.gun+"T12:00:00"); if (g < sinir) return;
    maddeler(k.liste).forEach(m=>{
      if (m.tur!=="sicaklik") return;
      const c = k.cevaplar[m.no]; if (!c || c.deger===undefined || c.yapilamadi) return;
      const disi = (m.alt!==undefined) && (c.deger < m.alt || c.deger > m.ust);
      satirlar.push({gun:k.gun, saat:c.zaman||"", sube:k.sube, liste:k.liste, nokta:m.ad,
                     deger:c.deger, alt:m.alt, ust:m.ust, kim:k.kisi||"", disi, not:c.not||"",
                     aksiyon:(k.aksiyonlar||[]).some(a=>a.madde===m.no)});
    });
  });
  satirlar.sort((a,b)=> (a.gun+a.saat) < (b.gun+b.saat) ? 1 : -1);
  return satirlar;
}

/* ---------------------------------------------------------------- fotoğraf */
function kucult(dosya){
  return new Promise((coz,hata)=>{
    const fr = new FileReader();
    fr.onload = ()=>{
      const im = new Image();
      im.onload = ()=>{
        const max = 900, o = Math.min(1, max/Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width*o); c.height = Math.round(im.height*o);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        let veri = c.toDataURL("image/jpeg", 0.55);
        // belge sınırı 256 KiB: gerekirse kaliteyi düşür
        for (const q of [0.42, 0.32, 0.24]) { if (veri.length < 190000) break; veri = c.toDataURL("image/jpeg", q); }
        coz(veri);
      };
      im.onerror = hata; im.src = fr.result;
    };
    fr.onerror = hata; fr.readAsDataURL(dosya);
  });
}

    alt.append(el("div",{style:"font-weight:600"}, k.sonuc==="basarili"?"Gönderildi · tamamlandı":"Gönderildi · başarısız (kritik madde)"),
               el("div",{class:"ss"}, "Doğrulama kodu "+kod(k.id)));
  }
  kutu.append(alt);
  setTimeout(()=>kanitlariYukle(kutu),0);
  return kutu;
}
async function kanitlariYukle(kok){
  for (const im of kok.querySelectorAll("img[data-kanit]")){
    const v = await Depo.kanitOku(im.getAttribute("data-kanit"));
    if (v && v.foto) im.src = v.foto;
  }
}

function maddeAc(k, m){
  sheetAc(kapat=>{
    const c = Object.assign({}, k.cevaplar[m.no]||{});
    let notIstendi = false;                              // kullanıcı kendi isteğiyle not/fotoğraf açtıysa
    const parcalar = [el("h3",{style:"font-size:19px;line-height:1.25;padding-right:40px"}, m.ad)];
    if (m.k) parcalar.push(el("div",{class:"pill crit",style:"align-self:flex-start"},"kritik madde"));

    /* --- not ve kanıt bloğu: varsayılan olarak gizli, kural gerektirince açılır --- */
    const uyariKutu = el("div");
    const kopyaKutu = el("div");
    const notBaslik = el("div",{class:"ss"},"Not");
    const notAlani = el("textarea",{class:"giris",rows:"2",placeholder:"Kısa not"}); notAlani.value = c.not||"";
    const fotoOnizleme = el("div");
    const dosya = el("input",{type:"file",accept:"image/*",capture:"environment",style:"display:none"});
    const fotoBtn = el("button",{class:"btn",onclick:()=>dosya.click()},"Fotoğraf ekle");
    const ekBlok = el("div",{style:"display:none;flex-direction:column;gap:9px"}, notBaslik, notAlani,
                      el("div",{style:"display:flex;gap:9px;align-items:center"}, fotoBtn, dosya), fotoOnizleme);
    const notAcBtn = el("button",{class:"btn kucuk",style:"align-self:flex-start",onclick:()=>{ notIstendi = true; yenile(); }},"Not veya fotoğraf ekle");

    const yapilamadiBtn = el("button",{class:"btn",style:"color:var(--uyari);border-color:var(--uyari)",onclick:()=>{ kapat(); yapilamadiAc(k,m); }},"Yapılamadı");
    const kaydet = el("button",{class:"btn pri",style:"flex:2"},"Kaydet");
    const altSira = el("div",{style:"display:flex;gap:9px;margin-top:4px"}, yapilamadiBtn, kaydet);

    notAlani.addEventListener("input",()=>{ c.not = notAlani.value; yenile(); });
    dosya.addEventListener("change", async e=>{
      const f = e.target.files[0]; if(!f) return;
      fotoBtn.textContent = "İşleniyor…"; fotoBtn.disabled = true; kopyaKutu.innerHTML = "";
      try{
        const ozet = await dosyaOzeti(f);                       // SHA-256
        const onceki = ozet ? await Depo.ozetOku(ozet) : null;
        if (onceki){                                            // aynı dosya ikinci kez
          olay(k, "Aynı fotoğraf ikinci kez gönderilmek istendi — reddedildi (madde "+m.no+")");
          await Depo.kosmaYaz(k);
          kopyaKutu.append(el("div",{style:"background:var(--kritikA);border:1px solid var(--kritik);border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.45"},
            el("b",{style:"color:var(--kritik)"},"Bu fotoğraf daha önce gönderildi. "),
            "Madde "+onceki.madde+" · "+saatStr(new Date(onceki.zaman))+" · "+(onceki.kisi||"")+" · yeniden çekin.",
            el("div",{class:"ss",style:"margin-top:3px"},"Dosya özeti (SHA-256) eşleşti; deneme olay izine yazıldı.")));
          e.target.value = ""; fotoBtn.disabled = false; yenile(); return;
        }
        const bayraklar = dosyaBayraklari(f);
        const veri = await kucult(f);
        const id = uuid();
        await Depo.kanitYaz(id, {foto:veri, kosma:k.id, madde:m.no, zaman:simdi().toISOString(), kisi:S.kisi?S.kisi.ad:"", sube:S.sube, ozet, bayraklar});
        if (ozet) await Depo.ozetYaz(ozet, {kosma:k.id, madde:m.no, zaman:simdi().toISOString(), kisi:S.kisi?S.kisi.ad:"", sube:S.sube});
        c.kanit = id; c.ozet = ozet; c.bayraklar = bayraklar;
        if (bayraklar.length) olay(k, "Madde "+m.no+" kanıtı işaretlendi: "+bayraklar.map(b=>b.metin).join("; "));
        onizle();
      }catch(err){ alert("Fotoğraf işlenemedi: "+err); }
      e.target.value = ""; fotoBtn.disabled = false; yenile();
    });
    const onizle = async ()=>{ fotoOnizleme.innerHTML=""; if(!c.kanit) return;
      const v = await Depo.kanitOku(c.kanit);
      if (v) fotoOnizleme.append(el("div",{}, el("img",{class:"foto",src:v.foto,style:"max-height:170px"}),
        el("div",{class:"damga"}, SUBELER.find(x=>x.id===S.sube).ad+" · "+saatStr(new Date(v.zaman))+" · "+(v.kisi||"")+" · damgalı"),
        (v.bayraklar&&v.bayraklar.length)? el("div",{style:"background:var(--uyariA);border-radius:8px;padding:7px 9px;margin-top:6px;font-size:12px;line-height:1.4;color:var(--ink2)"},
          el("b",{},"İşaretlendi: "), v.bayraklar.map(b=>b.metin).join(" · "),
          el("div",{class:"ss",style:"margin-top:2px"},"Kayıt kabul edildi; merkez bu işareti çalıştırma detayında ve raporda görür.")) : null)); };
    onizle();

    /* --- tür bileşenleri --- */
    if (m.tur==="sicaklik" || m.tur==="sayi"){
      const bas = (c.deger!==undefined?c.deger:m.bas);
      c.deger = bas;
      const gos = el("div",{style:"font-size:42px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums"}, String(bas));
      const adim = m.tur==="sicaklik"?0.1:5;
      const degis = n => { c.deger = Math.round((c.deger + n)*10)/10; gos.textContent = String(c.deger); yenile(); };
      if (m.alt!==undefined) parcalar.push(el("div",{class:"ss"},"Kabul aralığı "+m.alt+" – "+m.ust+" °C"));
      parcalar.push(el("div",{style:"display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0"},
        el("button",{class:"btn",style:"width:58px;height:58px;font-size:24px",onclick:()=>degis(-adim)},"−"), gos,
        el("button",{class:"btn",style:"width:58px;height:58px;font-size:24px",onclick:()=>degis(adim)},"+")));
      var deger_gos = gos;
    } else if (m.tur==="onay"){
      const be = el("button",{class:"sec",style:"flex:1;justify-content:center;min-height:56px;font-weight:600",onclick:()=>{ c.deger=true; secildi(); }},"Evet");
      const bh = el("button",{class:"sec",style:"flex:1;justify-content:center;min-height:56px;font-weight:600",onclick:()=>{ c.deger=false; secildi(); }},"Hayır");
      var secimDugmeleri = ()=>{ be.className="sec"+(c.deger===true?" on":""); bh.className="sec"+(c.deger===false?" on":""); };
      parcalar.push(el("div",{style:"display:flex;gap:9px"}, be, bh)); secimDugmeleri();
    } else if (m.tur==="secim"){
      const dugmeler = m.secenekler.map(s=>el("button",{class:"sec",style:"min-height:50px",onclick:()=>{
        if (s==="Yapılamadı"){ kapat(); yapilamadiAc(k,m); return; }
        c.deger=s; secildi(); }}, s));
      var secimDugmeleri = ()=>{ dugmeler.forEach((d,i)=>d.className="sec"+(c.deger===m.secenekler[i]?" on":"")); };
      parcalar.push(el("div",{style:"display:flex;flex-direction:column;gap:8px"}, ...dugmeler)); secimDugmeleri();
    } else if (m.tur==="metin"){
      const ta = el("textarea",{class:"giris",rows:"3",placeholder:"Kısa not"}); ta.value = c.deger||"";
      ta.addEventListener("input",()=>{ c.deger = ta.value; yenile(); });
      parcalar.push(ta);
    }

    /* --- kurallar --- */
    function gerekli(){                                   // [not gerekli, fotoğraf gerekli]
      const dd = cevapDurum(m, c);
      if (dd==="basarisiz") return [true, true];          // tek sabit kural
      if (m.f && dd==="ok") return [false, true];         // fotoğraf zorunlu madde
      return [false, false];
    }
    function yenile(){
      const dd = cevapDurum(m, c);
      const [notGer, fotoGer] = gerekli();
      if (deger_gos) deger_gos.style.color = (m.alt!==undefined && (c.deger<m.alt||c.deger>m.ust)) ? "var(--kritik)" : "var(--ink)";
      if (secimDugmeleri) secimDugmeleri();
      // uyarı kutusu
      uyariKutu.innerHTML = "";
      if (dd==="basarisiz"){
        uyariKutu.append(el("div",{style:"background:var(--kritikA);border:1px solid var(--kritik);border-radius:11px;padding:11px 13px;font-size:13.5px;line-height:1.45"},
          el("b",{style:"color:var(--kritik)"}, m.alt!==undefined?"Aralık dışı. ":"Olumsuz cevap. "),
          "Fotoğraf ve not zorunlu."+(m.k?" Kritik madde: şube ve bölge müdürüne bildirilir, aksiyon açılır.":"")));
      } else if (fotoGer && !c.kanit){
        uyariKutu.append(el("div",{style:"background:var(--yuzey2);border-radius:11px;padding:10px 12px;font-size:13px;line-height:1.45"},
          el("b",{},"Bu maddede fotoğraf zorunlu. "), "Diğer maddelerde fotoğraf istenmez."));
      }
      // blok görünürlüğü ve etiketler
      const goster = notGer || fotoGer || notIstendi || c.not || c.kanit;
      ekBlok.style.display = goster ? "flex" : "none";
      notAcBtn.style.display = goster ? "none" : "inline-flex";
      notBaslik.textContent = notGer ? "Not (zorunlu)" : "Not (isteğe bağlı)";
      notAlani.placeholder = notGer ? "Ne oldu, ne yapıldı?" : "Kısa not";
      fotoBtn.textContent = c.kanit ? "Fotoğrafı değiştir" : (fotoGer ? "Fotoğraf çek (zorunlu)" : "Fotoğraf ekle");
      fotoBtn.className = "btn" + (fotoGer && !c.kanit ? " pri" : "");
      // kaydet durumu
      const eksik = (dd==="bos") || (notGer && !c.not) || (fotoGer && !c.kanit);
      kaydet.disabled = eksik;
      kaydet.textContent = dd==="bos" ? "Cevap verin" : eksik ? (notGer && !c.not && fotoGer && !c.kanit ? "Fotoğraf ve not gerekli" : (!c.not&&notGer?"Not gerekli":"Fotoğraf gerekli")) : "Kaydet";
    }
    async function kaydetEt(){
      c.zaman = saatStr(simdi());
      k.cevaplar[m.no] = c;
      const dd = cevapDurum(m,c);
      const gos = (m.tur==="sicaklik") ? " ("+c.deger+" °C)" : (m.tur==="sayi"||m.tur==="secim") ? " ("+c.deger+")" : (m.tur==="onay" ? (c.deger?" (Evet)":" (Hayır)") : "");
      olay(k, "Madde "+m.no+": "+(dd==="basarisiz"?"başarısız":"cevaplandı")+gos);
      if (dd==="basarisiz" && m.k){
        k.aksiyonlar = (k.aksiyonlar||[]).concat([{id:uuid(), madde:m.no, baslik:m.ad, sorumlu:SORUMLU, acildi:simdi().toISOString(), durum:"acik", not:""}]);
        olay(k, "Aksiyon açıldı · kritik · "+SORUMLU);
      }
      await Depo.kosmaYaz(k); kapat(); ciz();
    }
    function secildi(){                                   // onay/seçim: gerek yoksa tek dokunuşta kaydet
      const [notGer, fotoGer] = gerekli();
      if (!notGer && !fotoGer && !notIstendi && !c.not && !c.kanit){ kaydetEt(); return; }
      yenile();
    }
    kaydet.addEventListener("click", kaydetEt);
    yenile();
    parcalar.push(kopyaKutu, uyariKutu, notAcBtn, ekBlok, altSira);
    return parcalar;
  });
}
function yapilamadiAc(k, m){
  sheetAc(kapat=>{
    const c = {yapilamadi:true, sebep:null, not:"", zaman:saatStr(simdi())};
    const not = el("textarea",{class:"giris",rows:"2",placeholder:"Not"});
    const kaydet = el("button",{class:"btn kritik",style:"flex:2",disabled:"disabled"},"Kaydet ve bildir");
    const dugmeler = SEBEPLER.map(s=>el("button",{class:"sec",onclick:()=>{ c.sebep=s; ciz2(); }}, s));
    const ciz2 = ()=>{ dugmeler.forEach((d,i)=>d.className="sec"+(c.sebep===SEBEPLER[i]?" on":""));
      kaydet.disabled = !c.sebep || (c.sebep.startsWith("Diğer") && !not.value.trim()); };
    not.addEventListener("input",()=>{ c.not=not.value; ciz2(); });
    kaydet.addEventListener("click", async ()=>{
      k.cevaplar[m.no] = c;
      k.aksiyonlar = (k.aksiyonlar||[]).concat([{id:uuid(), madde:m.no, baslik:m.ad+" (yapılamadı)", sorumlu:SORUMLU, acildi:simdi().toISOString(), durum:"acik", not:c.sebep}]);
      olay(k, "Madde "+m.no+" yapılamadı ("+c.sebep+") → aksiyon açıldı");
      await Depo.kosmaYaz(k); kapat(); ciz();
    });
    return [el("h3",{style:"font-size:19px;line-height:1.25"},"Yapılamadı — "+m.ad),
      el("div",{class:"ss"},"Sebep seçin; iş kaybolmaz, şube müdürüne 72 saatlik aksiyon olarak düşer."),
      el("div",{style:"display:flex;flex-direction:column;gap:8px"}, ...dugmeler), not,
      el("div",{style:"display:flex;gap:9px"}, el("button",{class:"btn",style:"flex:1",onclick:kapat},"Vazgeç"), kaydet)];
  });
}
async function gonder(k){
  const kritikBasarisiz = maddeler(k.liste).some(m=>m.k && cevapDurum(m,k.cevaplar[m.no])==="basarisiz");
  k.durum = "gonderildi"; k.sonuc = kritikBasarisiz ? "basarisiz" : "basarili";
  k.gonderim = simdi().toISOString();
  const p = pencere(k.sube, k.gun);
  k.gec = simdi() > p.bit;
  olay(k, "Gönderildi · "+(kritikBasarisiz?"başarısız (kritik madde)":"tamamlandı")+(k.gec?" · geç":"")+" · kayıt kilitlendi");
  await Depo.kosmaYaz(k); S.acik="liste:"+k.liste; ciz();
}

/* ---------------------------------------------------------------- çizim: merkez */
function merkezCiz(app){
  const t = simdi();
  const LISTE_SIRA = ["acilis","kapanis"];
  app.append(el("div",{style:"display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:16px 0 12px"},
    el("h1",{style:"font-size:26px"},"Operasyon panosu"),
    el("div",{style:"display:flex;gap:8px;align-items:center;flex-wrap:wrap"},
      el("button",{class:"btn kucuk"+(S.supheli?" pri":""),onclick:()=>{ S.supheli=!S.supheli; ciz(); }},"Şüpheli kanıt"),
      el("button",{class:"btn kucuk",onclick:()=>sicaklikGunlugu(30)},"Sıcaklık günlüğü"),
      el("div",{class:"ss"}, tarihStr(t)+" · "+saatStr(t)+" · canlı"))));

  const hucreler = [];
  SUBELER.forEach(sube=>{ LISTE_SIRA.forEach(liste=>{
    const gun = isGunu(sube.id, t), k = kosmaBul(sube.id, gun, liste);
    hucreler.push({sube, liste, gun, k, d: durumHesapla(k, t, sube.id, gun, liste)});
  });});

  const say = {basarili:0, basarisiz:0, kacirildi:0, acik:0, planlandi:0, aksiyon:0, yapilamadi:0};
  hucreler.forEach(({k,d,liste})=>{ say[d]=(say[d]||0)+1;
    if(k){ say.aksiyon += (k.aksiyonlar||[]).filter(a=>a.durum==="acik").length;
           say.yapilamadi += maddeler(liste).filter(m=>cevapDurum(m,k.cevaplar[m.no])==="yapilamadi").length; } });
  const kpiKutu = el("div",{style:"display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:14px"});
  [["Tamamlandı",say.basarili,"var(--marka)"],["Başarısız",say.basarisiz,"var(--kritik)"],["Kaçırıldı",say.kacirildi,"var(--kritik)"],
   ["Açık liste",say.acik,"var(--uyari)"],["Yapılamadı",say.yapilamadi,"var(--ink)"],["Açık aksiyon",say.aksiyon,"var(--uyari)"]]
   .forEach(([ad,n,c])=>kpiKutu.append(el("div",{class:"kpi"}, el("b",{style:"color:"+c},String(n)), el("span",{class:"ss"},ad))));
  app.append(kpiKutu);

  const dikkat = S.supheli
    ? hucreler.filter(h=> h.k && kosmaBayraklari(h.k).length)
    : hucreler.filter(h=> h.d==="basarisiz" || h.d==="kacirildi" || (h.k&&(h.k.aksiyonlar||[]).some(a=>a.durum==="acik")));
  app.append(el("div",{class:"etiket",style:"margin-bottom:6px"},
    (S.supheli?"Şüpheli kanıt taşıyan çalıştırmalar (":"Dikkat isteyenler (")+dikkat.length+")"));
  if (!dikkat.length){
    app.append(el("div",{class:"kart",style:"background:var(--markaA);border-color:var(--markaA)"},
      el("div",{style:"font-family:var(--serif);font-weight:700;font-size:17px;color:var(--marka)"}, S.supheli?"İşaretli kanıt yok":"Her şey yolunda"),
      el("div",{class:"ss",style:"margin-top:3px"}, S.supheli
        ? "Bu iş gününde kanıt bütünlüğü işareti taşıyan çalıştırma yok."
        : "Bu iş gününde dikkat isteyen liste yok; aşağıdaki ızgarada tüm durumu görebilirsiniz.")));
  } else {
    const tb = el("div",{class:"tablo"});
    const tablo = el("table",{}, el("thead",{},el("tr",{},...["Şube","Liste","Durum","Ayrıntı",""].map(h=>el("th",{},h)))));
    const tbody = el("tbody",{});
    dikkat.forEach(({sube,liste,k,d})=>{
      const ac = k ? (k.aksiyonlar||[]).filter(a=>a.durum==="acik").length : 0;
      tbody.append(el("tr",{style:"cursor:pointer",onclick:()=>{ if(k){ S.acik="detay:"+k.id; ciz(); } }},
        el("td",{style:"font-weight:600"},sube.ad), el("td",{}, listeAdi(liste).replace(" listesi","")),
        el("td",{}, el("span",{class:"pill "+(d==="basarili"?"ok":d==="acik"?"warn":"crit")}, DURUM_AD[d])),
        el("td",{class:"mut"}, k ? (k.gonderim? saatStr(new Date(k.gonderim))+" · "+(k.kisi||"") : "gönderim yok")+(ac?" · "+ac+" açık aksiyon":"") : "kayıt yok"),
        el("td",{style:"text-align:right;color:var(--sessiz)"},"›")));
    });
    tablo.append(tbody); tb.append(tablo); app.append(tb);

  const iz = el("div",{class:"kart",style:"margin-top:14px"});
  iz.append(el("div",{class:"etiket",style:"margin-bottom:8px"},"Şube × liste · bu iş günü"));
  const izgara = el("div",{class:"izgara",style:"grid-template-columns:110px repeat("+LISTE_SIRA.length+",minmax(0,1fr))"});
  izgara.append(el("div",{}), ...LISTE_SIRA.map(l=>el("div",{class:"ss",style:"text-align:center"}, listeAdi(l).replace(" listesi",""))));
  SUBELER.forEach(sube=>{
    izgara.append(el("div",{class:"mut"},sube.ad));
    LISTE_SIRA.forEach(liste=>{
      const h = hucreler.find(x=>x.sube.id===sube.id && x.liste===liste);
      izgara.append(el("div",{class:"hucre",style:"background:"+DURUM_RENK[h.d],title:sube.ad+" · "+listeAdi(liste)+" · "+DURUM_AD[h.d],
        onclick:()=>{ if(h.k){ S.acik="detay:"+h.k.id; ciz(); } }}));
    });
  });
  iz.append(izgara);
  iz.append(el("div",{class:"ss",style:"margin-top:8px"},"Yeşil tamamlandı · kırmızı başarısız veya kaçırıldı · sarı açık · gri henüz açılmadı"));
  app.append(iz);

  if (S.acik && S.acik.startsWith("detay:")){
    const k = S.kosmalar[S.acik.slice(6)];
    if (k) app.append(detayCiz(k));
  }
}

/* ---------------------------------------------------------------- çizim: sabah özeti (E-5) */
function ozetCiz(app){
  const t = simdi(), gun = ozetGunu(t);
  const satirlar = SUBELER.map(sube=>{
    const k = kosmaBul(sube.id, gun, "kapanis");
    return {sube, k, d: durumHesapla(k, t, sube.id, gun, "kapanis")};
  });
  const sorunlu = satirlar.filter(x=> x.d==="basarisiz" || x.d==="kacirildi" || (x.k&&(x.k.aksiyonlar||[]).some(a=>a.durum==="acik")));
  const yolunda = satirlar.filter(x=> x.d==="basarili" && !(x.k&&(x.k.aksiyonlar||[]).some(a=>a.durum==="acik")));
  const acikAksiyon = satirlar.reduce((n,x)=> n + (x.k?(x.k.aksiyonlar||[]).filter(a=>a.durum==="acik").length:0), 0);

  app.append(el("div",{style:"display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:16px 0 10px"},
    el("h1",{style:"font-size:26px"},"Sabah özeti"),
    el("div",{class:"ss"}, "Dün gece · "+tarihStr(new Date(gun+"T12:00:00"))+" · bölge müdürü görünümü")));

  // bildirim kartı (ürün bunu 07:00'de push + e-posta olarak gönderir)
  const metin = sorunlu.length
    ? sorunlu.length+" şube dikkat istiyor: "+sorunlu.map(x=>x.sube.ad+" "+DURUM_AD[x.d]).join(", ")+". "+acikAksiyon+" açık aksiyon."
    : satirlar.length+" şubenin "+satirlar.length+"'i yolunda. Açık aksiyon yok.";
  app.append(el("div",{style:"background:var(--ink);color:#fff;border-radius:16px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start"},
    el("div",{style:"width:38px;height:38px;border-radius:10px;background:var(--marka);display:flex;align-items:center;justify-content:center;flex:none"},
      el("svg",{viewBox:"0 0 24 24",width:"19",height:"19",fill:"none",stroke:"#fff","stroke-width":"2","stroke-linecap":"round","stroke-linejoin":"round",
        html:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 20a2 2 0 0 0 4 0"></path>'})),
    el("div",{style:"font-size:13.5px;line-height:1.45"},
      el("b",{},"Sabah özeti · "+SUBELER.length+" şube · 07:00"), el("br",{}),
      el("span",{style:"opacity:.85"}, metin))));
  app.append(el("div",{class:"uyari-bant"},"Gerçek üründe bu özet her sabah 07:00'de push bildirimi ve e-posta olarak gider; gece yalnızca kritik maddeler anında bildirilir (sessiz saat 23:00–07:00). Demoda bildirim gönderilmez, özet ekranda hesaplanır."));

  const kpi = (n,l,c)=>el("div",{class:"kpi"}, el("b",{style:"color:"+c},String(n)), el("span",{class:"ss"},l));
  app.append(el("div",{style:"display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:12px 0"},
    kpi(yolunda.length,"yolunda","var(--marka)"),
    kpi(satirlar.filter(x=>x.d==="basarisiz").length,"başarısız","var(--kritik)"),
    kpi(satirlar.filter(x=>x.d==="kacirildi").length,"kaçırıldı","var(--kritik)"),
    kpi(acikAksiyon,"açık aksiyon","var(--uyari)")));

  sorunlu.forEach(({sube,k,d})=>{
    const md = maddeler("kapanis");
    const sebep = k ? md.filter(m=>["basarisiz","yapilamadi"].includes(cevapDurum(m,k.cevaplar[m.no])))
                        .map(m=>{ const c=k.cevaplar[m.no]; return m.ad+(cevapDurum(m,c)==="yapilamadi"?" (yapılamadı: "+c.sebep+")":(c.deger!==undefined?" "+c.deger+(m.tur==="sicaklik"?" °C":""):"")); }).join(" · ")
                  : "gönderim yok · şube müdürüne bildirildi";
    const aks = k ? (k.aksiyonlar||[]).filter(a=>a.durum==="acik") : [];
    const kart = el("div",{class:"kart",style:"margin-bottom:9px;border-color:var(--kritik);cursor:"+(k?"pointer":"default"),
      onclick:()=>{ if(k){ S.rol="merkez"; location.hash="merkez"; S.acik="detay:"+k.id; ciz(); } }},
      el("div",{style:"display:flex;align-items:center;gap:9px;flex-wrap:wrap"},
        el("b",{style:"font-size:15px"}, sube.ad+" · Kapanış"),
        el("span",{class:"pill crit"}, DURUM_AD[d]),
        k&&k.gonderim? el("span",{class:"ss"}, saatStr(new Date(k.gonderim))+" · "+(k.kisi||"")) : null),
      el("div",{class:"ss",style:"margin-top:4px;line-height:1.45"}, sebep),
      aks.length? el("div",{style:"font-size:13px;color:var(--kritik);font-weight:600;margin-top:5px"},
        aks.length+" açık aksiyon · sorumlu "+aks[0].sorumlu) : null);
    app.append(kart);
  });
  if (yolunda.length){
    app.append(el("div",{class:"kart",style:"border-color:var(--marka)"},
      el("div",{style:"display:flex;gap:10px;align-items:center"},
        el("div",{class:"kutucuk ok"}, el("svg",{viewBox:"0 0 24 24",width:"15",height:"15",fill:"none",stroke:"#fff","stroke-width":"3","stroke-linecap":"round","stroke-linejoin":"round",html:'<path d="M5 12l4 4L19 6"></path>'})),
        el("div",{}, el("b",{}, yolunda.length+" şube yolunda"),
          el("div",{class:"ss"}, yolunda.map(x=>x.sube.ad).join(", "))))));
  }
  app.append(el("div",{class:"ss",style:"margin-top:12px"},"Panodaki ızgara tüm listeleri (açılış ve kapanış) gösterir; bu özet yalnızca gece listesini kapsar."));
}

function detayCiz(k){
  const sube = SUBELER.find(x=>x.id===k.sube);
  const kutu = el("div",{class:"kart",style:"margin-top:14px;display:flex;flex-direction:column;gap:12px"});
  const d = durumHesapla(k, simdi(), k.sube, k.gun, k.liste);
  kutu.append(el("div",{style:"display:flex;align-items:center;gap:10px;flex-wrap:wrap"},
    el("h2",{style:"font-size:20px"}, sube.ad+" · "+listeAdi(k.liste).replace(" listesi","")+" · "+tarihStr(new Date(k.gun+"T12:00:00"))),
    el("span",{class:"pill "+(d==="basarili"?"ok":d==="acik"?"warn":"crit")}, DURUM_AD[d]),
    el("div",{style:"margin-left:auto;display:flex;gap:8px"},
      el("button",{class:"btn kucuk",onclick:()=>{ S.acik=null; ciz(); }},"Kapat"),
      el("button",{class:"btn kucuk dar",onclick:()=>rapor(k)},"Rapor / yazdır"))));
  kutu.append(el("div",{class:"ss"},
    (k.kisi||"—")+" · açılış "+(k.acilis?saatStr(new Date(k.acilis)):"—")+" · gönderim "+(k.gonderim?saatStr(new Date(k.gonderim)):"—")+" · doğrulama kodu "+kod(k.id)));

  const liste = el("div",{});
  maddeler(k.liste).forEach(m=>{
    const c = k.cevaplar[m.no], dd = cevapDurum(m,c);
    if (dd==="bos") return;
    liste.append(el("div",{class:"satir",style:"min-height:44px;padding:7px 0"},
      el("div",{style:"width:22px;color:var(--sessiz);font-size:12px"},String(m.no)),
      el("div",{style:"flex:1;min-width:0"}, m.ad,
        c.not?el("div",{class:"ss"},"not: "+c.not):null, c.sebep?el("div",{class:"ss",style:"color:var(--uyari)"},"sebep: "+c.sebep):null),
      c.kanit?el("img",{class:"foto",style:"width:54px;height:40px;flex:none","data-kanit":c.kanit}):null,
      (c.bayraklar&&c.bayraklar.length)? el("div",{style:"display:flex;gap:4px"}, ...c.bayraklar.map(bayrakRozet)) : null,
      el("div",{style:"text-align:right;white-space:nowrap;font-size:13px;font-weight:600;color:"+(dd==="basarisiz"?"var(--kritik)":dd==="yapilamadi"?"var(--uyari)":"var(--ink2)")},
        dd==="yapilamadi"?"yapılamadı":(m.tur==="onay"?(c.deger?"Evet":"Hayır"):m.tur==="metin"?"not":String(c.deger)+(m.tur==="sicaklik"?" °C":"")) ),
      el("div",{class:"ss",style:"width:42px;text-align:right"}, c.zaman||"")));
  });
  kutu.append(el("div",{class:"etiket"},"Maddeler ve cevaplar"), liste);

  const bl = kosmaBayraklari(k);
  if (bl.length){
    const kutu2 = el("div",{style:"background:var(--uyariA);border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.5;color:var(--ink2)"});
    kutu2.append(el("b",{},"Kanıt bütünlüğü · "+bl.length+" işaret"));
    bl.forEach(b=> kutu2.append(el("div",{style:"margin-top:3px"}, (b.madde?("Madde "+b.madde+": "):"")+b.metin)));
    kutu2.append(el("div",{class:"ss",style:"margin-top:5px"},"İşaret suçlama değil, incelemeye çağrıdır; kayıt kabul edilmiştir. Aynı dosyanın ikinci kez gönderilmesi engellenir."));
    kutu.append(el("div",{class:"etiket"},"Kanıt bütünlüğü"), kutu2);
  }
  const aks = (k.aksiyonlar||[]);
  if (aks.length){
    const ak = el("div",{style:"display:flex;flex-direction:column;gap:8px"});
    aks.forEach(a=>{
      const satir = el("div",{style:"border:1px solid "+(a.durum==="acik"?"var(--kritik)":"var(--cizgi)")+";border-radius:11px;padding:10px 12px"},
        el("div",{style:"font-weight:600"}, a.baslik),
        el("div",{class:"ss"}, "Sorumlu "+a.sorumlu+" · açıldı "+saatStr(new Date(a.acildi))+(a.not?" · "+a.not:"")));
      if (a.durum==="acik" && S.mod!=="okuma"){
        const not = el("input",{class:"giris",placeholder:"Kapanış notu (zorunlu)",style:"margin-top:8px"});
        const btn = el("button",{class:"btn kucuk pri",style:"margin-top:8px",onclick:async()=>{
          if(!not.value.trim()){ not.focus(); return; }
          a.durum="kapali"; a.kapanisNotu=not.value.trim(); a.kapandi=simdi().toISOString();
          olay(k, "Aksiyon kapatıldı — "+a.kapanisNotu, SORUMLU);
          await Depo.kosmaYaz(k); ciz();
        }},"Aksiyonu kapat");
        satir.append(not, btn);
      } else if (a.durum==="kapali"){
        satir.append(el("div",{class:"ss",style:"color:var(--marka);font-weight:600;margin-top:4px"},"Kapalı "+saatStr(new Date(a.kapandi))+" — "+a.kapanisNotu));
      }
      ak.append(satir);
    });
    kutu.append(el("div",{class:"etiket"},"Aksiyonlar"), ak);
  }
  const iz = el("div",{});
  (k.olaylar||[]).forEach(o=> iz.append(el("div",{class:"olay"}, el("b",{},saatStr(new Date(o.t))), el("span",{}, o.ne+" · "+o.kim))));
  kutu.append(el("div",{class:"etiket"},"Olay izi"), iz);
  setTimeout(()=>kanitlariYukle(kutu),0);
  return kutu;
}

async function rapor(k){
  const sube = SUBELER.find(x=>x.id===k.sube);
  const fotolar = [];
  for (const m of maddeler(k.liste)){ const c = k.cevaplar[m.no]; if (c && c.kanit){ const v = await Depo.kanitOku(c.kanit); if (v) fotolar.push({m, v}); } }
  const satir = m => { const c = k.cevaplar[m.no], dd = cevapDurum(m,c); if (dd==="bos") return "";
    const cevap = dd==="yapilamadi" ? "Yapılamadı — "+c.sebep : (m.tur==="onay"?(c.deger?"Evet":"Hayır"):m.tur==="metin"?(c.deger||""):String(c.deger)+(m.tur==="sicaklik"?" °C":""));
    return '<tr><td>'+m.no+'</td><td>'+m.ad+(c.not?'<div class="rn">not: '+c.not+'</div>':'')+'</td><td class="'+(dd==='basarisiz'?'rk':'')+'">'+cevap+'</td><td>'+(c.zaman||"")+'</td></tr>'; };
  const p = pencere(k.sube, k.gun, k.liste);
  const govde =
    '<h1>Çalıştırma raporu — '+sube.ad+' · '+listeAdi(k.liste)+'</h1>'+
    '<div class="rss">'+k.gun+' · pencere '+saatStr(p.bas)+'–'+saatStr(p.bit)+' · gönderim '+(k.gonderim?saatStr(new Date(k.gonderim)):"—")+' · '+(k.kisi||"")+
      ' · sonuç: <b>'+(k.sonuc==="basarisiz"?"BAŞARISIZ (kritik madde)":k.sonuc==="basarili"?"tamamlandı":"açık")+'</b></div>'+
    '<table><thead><tr><th>#</th><th>Madde</th><th>Cevap</th><th>Saat</th></tr></thead><tbody>'+maddeler(k.liste).map(satir).join("")+'</tbody></table>'+
    '<h3>Kanıt fotoğrafları ('+fotolar.length+')</h3>'+
    '<div class="rfoto">'+fotolar.map(f=>'<span class="rf"><img src="'+f.v.foto+'"><div class="rd">'+sube.ad+' · '+new Date(f.v.zaman).toLocaleString("tr-TR")+' · '+(f.v.kisi||"")+'</div><div class="rss">madde '+f.m.no+'</div></span>').join("")+'</div>'+
    (function(){ const bl = kosmaBayraklari(k); return bl.length ?
       '<h3>Kanıt bütünlüğü işaretleri ('+bl.length+')</h3><table><tbody>'+
       bl.map(b=>'<tr><td style="width:70px">'+(b.madde?("madde "+b.madde):"—")+'</td><td>'+b.metin+'</td></tr>').join("")+'</tbody></table>'+
       '<div class="rss">İşaret suçlama değil, incelemeye çağrıdır: kayıt kabul edilmiştir.</div>' : ''; })()+
    '<h3>Olay izi</h3><table><tbody>'+(k.olaylar||[]).map(o=>'<tr><td style="width:66px">'+saatStr(new Date(o.t))+'</td><td>'+o.ne+'</td><td style="width:160px">'+o.kim+'</td></tr>').join("")+'</tbody></table>'+
    '<div class="rkod">Doğrulama kodu '+kod(k.id)+' · üretildi '+new Date().toLocaleString("tr-TR")+' · DEMO ÇIKTISI</div>';

  raporAc(govde, "Denetimde verilen belge · yazdırın ya da PDF olarak kaydedin");
}

function raporAc(govde, ustMetin){
  document.querySelector("#rapor")?.remove();
  const kat = el("div",{id:"rapor"});
  const ust = el("div",{class:"rust yazdirma-gizle"},
    el("div",{class:"ss"}, ustMetin||"Denetimde verilen belge · yazdırın ya da PDF olarak kaydedin"),
    el("div",{style:"display:flex;gap:8px;margin-left:auto"},
      el("button",{class:"btn kucuk",onclick:()=>{ document.body.classList.remove("rapor-acik"); kat.remove(); }},"Kapat"),
      el("button",{class:"btn kucuk dar",onclick:()=>window.print()},"Yazdır / PDF")));
  kat.append(ust, el("div",{class:"ric", html:govde}));
  document.body.append(kat);
  document.body.classList.add("rapor-acik");
  kat.scrollTop = 0;
}

/* ---------------------------------------------------------------- çizim: ayar */
function ayarCiz(app){
  app.append(el("h1",{style:"font-size:24px;margin:16px 0 10px"},"Demo ayarı"));
  app.append(el("div",{class:"uyari-bant"},
    el("b",{},"Bu bir demodur, ürün değildir. "),
    "Kayıtlar Anthropic altyapısındaki artifact veri tabanında durur — Türkiye'de değil. Gerçek personel adı, gerçek müşteri verisi ve kişi yüzü içeren fotoğraf girmeyin. Push bildirimi ve SMS yoktur; sabah özeti yalnızca ekranda hesaplanır."));

  const t = simdi();
  const kutu = el("div",{class:"kart",style:"display:flex;flex-direction:column;gap:11px;max-width:620px"});
  kutu.append(el("div",{class:"etiket"},"Demo saati"),
    el("div",{}, el("b",{style:"font-size:19px"}, saatStr(t)), el("span",{class:"ss"}, " · "+tarihStr(t)+" · kaydırma "+(S.kaydirma>=0?"+":"")+S.kaydirma+" dk")));
  const dugme = (ad,dk)=>el("button",{class:"btn kucuk",onclick:()=>{ S.kaydirma+=dk; ayarYay(); ciz(); }},ad);
  kutu.append(el("div",{style:"display:flex;gap:8px;flex-wrap:wrap"},
    dugme("+15 dk",15), dugme("+1 saat",60), dugme("+3 saat",180),
    el("button",{class:"btn kucuk",onclick:()=>{ const p=pencere(S.sube,isGunu(S.sube,simdi()),"kapanis"); S.kaydirma += Math.round((p.bas-simdi())/60000)+10; ayarYay(); ciz(); }},"Kapanış penceresini aç"),
    el("button",{class:"btn kucuk",onclick:()=>{ const g=isGunu(S.sube,simdi()); const p=pencere(S.sube,g,"acilis"); let fark=Math.round((p.bas-simdi())/60000)+10; if(fark<0) fark+=24*60; S.kaydirma += fark; ayarYay(); ciz(); }},"Açılış penceresini aç"),
    el("button",{class:"btn kucuk",onclick:()=>{ const p=pencere(S.sube,isGunu(S.sube,simdi()),"kapanis"); S.kaydirma += Math.round((p.tol-simdi())/60000)+10; ayarYay(); ciz(); }},"Toleransı doldur (kaçırıldı)"),
    el("button",{class:"btn kucuk",onclick:()=>{ S.kaydirma=0; ayarYay(); ciz(); }},"Sıfırla")));
  kutu.append(el("div",{class:"ss"},"Saat kaydırma paylaşımlı modda tüm cihazlarda aynıdır; böylece tablet ve pano aynı saati görür."));
  app.append(kutu);

  const kutu2 = el("div",{class:"kart",style:"margin-top:12px;display:flex;flex-direction:column;gap:10px;max-width:620px"});
  kutu2.append(el("div",{class:"etiket"},"Kayıtlar"),
    el("div",{class:"ss"}, Object.keys(S.kosmalar).length+" çalıştırma kaydı · mod: "+
      (S.mod==="paylasimli"?"paylaşımlı (cihazlar arası)":S.mod==="okuma"?"okuma (yazma yetkiniz yok)":"yerel (yalnızca bu cihaz)")));
  kutu2.append(el("div",{style:"display:flex;gap:8px;flex-wrap:wrap"},
    el("button",{class:"btn kucuk",onclick:async()=>{ if(confirm("Tüm demo kayıtları silinsin mi?")) await Depo.hepsiniSil(); }},"Kayıtları sil")));
  kutu2.append(el("div",{class:"ss"},"Paylaşımlı mod yalnızca bu artifact'a yazma yetkisi olan hesaplarda çalışır (sahibi ve e-postayla davet edilen düzenleyiciler). Diğer herkeste akış aynıdır, veriler cihazda kalır."));
  app.append(kutu2);

  const kutu3 = el("div",{class:"kart",style:"margin-top:12px;max-width:620px"});
  kutu3.append(el("div",{class:"etiket",style:"margin-bottom:6px"},"Bu demoda olmayan (üründe var)"),
    el("div",{class:"ss",style:"line-height:1.6"},
      "Push bildirimi ve SMS (sabah özeti ekranda hesaplanır, gönderilmez) · gerçek kimlik ve rol güvenliği · 72 saatlik çevrimdışı kuyruk · sunucu tarafı damga ve hash zinciri · belge takvimi · aylık özet · yakın kopya (benzer kare) tespiti · konum ve cihaz saati bayrakları · madde kütüphanesi · kurulum sihirbazı."));
  app.append(kutu3);
}
function ayarYay(){ Depo.ayarYaz({kaydirma:S.kaydirma, guncellendi:new Date().toISOString()}); }

/* ---------------------------------------------------------------- sheet */
function sheetAc(yapici){
  const kat = el("div",{class:"sheet",onclick:e=>{ if(e.target===kat) kapat(); }});
  const ic = el("div",{class:"sheet-in",style:"position:relative"});
  function kapat(){ kat.remove(); }
  const kapatBtn = el("button",{"aria-label":"Kapat",style:"position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--yuzey2);color:var(--ink2);font-size:19px;line-height:1",onclick:kapat},"×");
  ic.append(kapatBtn);
  ic.append(...[].concat(yapici(kapat)));
  kat.append(ic); document.body.append(kat);
}

/* ---------------------------------------------------------------- çizim */
function barEtiketleri(){
  const dar = innerWidth < 560;
  document.querySelectorAll("[data-git]").forEach(b=>{ b.textContent = dar ? b.dataset.kisa : b.dataset.uzun; });
}
addEventListener("resize", barEtiketleri);

function ciz(){
  const app = $("#app"); app.innerHTML = "";
  barEtiketleri();
  $("#saatRozet").textContent = saatStr(simdi())+" · demo saati";
  $("#saatRozet").className = "pill" + (S.kaydirma?" warn":" gri");
  document.querySelectorAll("[data-git]").forEach(b=>{
    b.style.borderColor = b.dataset.git===S.rol ? "var(--marka)" : "var(--cizgi)";
    b.style.color = b.dataset.git===S.rol ? "var(--marka)" : "var(--ink)";
  });
  if (S.rol==="kiosk") kioskCiz(app);
  else if (S.rol==="merkez") merkezCiz(app);
  else if (S.rol==="ozet") ozetCiz(app);
  else ayarCiz(app);
}
document.querySelectorAll("[data-git]").forEach(b=>b.addEventListener("click",()=>{
  S.rol = b.dataset.git; S.acik = null; location.hash = S.rol; ciz();
}));
window.addEventListener("hashchange",()=>{ const h=location.hash.replace("#",""); if(["kiosk","merkez","ozet","ayar"].includes(h)){ S.rol=h; ciz(); } });
setInterval(()=>{ if (S.rol==="merkez"||S.rol==="ozet") ciz(); else $("#saatRozet").textContent = saatStr(simdi())+" · demo saati"; }, 30000);

ciz();
depoBaslat();
</script>
